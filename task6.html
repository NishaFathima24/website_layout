<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
     }
       *{
        padding:0px;
        margin:0px;
        box-sizing: border-box;
       
       }
       header{
        
         display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #4b123b;
    padding: 20px 7%;
       }
       .logo{
        color:white;
        font-weight:bold;
        font-size:22px;
        transition: transform 0.4s ease;

       
       }
       .logo:hover{
        color:pink;
        transform: scale(1.3);
       }
       ul{
        display:flex;
        gap:25px;
        list-style: none;
       }
       li a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    display: inline-block;

    transition: color 0.3s ease;
                
}

li a:hover {
    color: pink;
   
}
.welcome{
    background-color:#fcd8f2;
    height:200px;
    text-align:center;
    gap:5px;
    padding:50px;
    transition:background 0.4s ease;
   
}
.welcome:hover{
   background-color:#5f0e48;
   color:#c277ad;
}
button{
    background-color:#4b123b;
    color:white;
    margin:10px;
    padding:5px;
    box-sizing: border-box;
    border-radius: 5px 5px 5px;
}
button:hover{
    color:pink;
}
.article{
     padding:35px 20px;
     text-align:center;
    
}

.article h2{
    margin-bottom:25px;
    color:#4b123b;
}
.card-container{
    display:flex;
    justify-content: center;
    gap:20px;
}
.card{
    width:200px;
    background-color:white;
    padding:25px 15px;
    box-sizing: border-box;
    border-radius:10px;
    transition: transform 0.4s ease;
}
.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 10px 20px grey;
}
.card h3{
    color:#6e325d;
    margin-bottom:12px;
    
}
.card p{
    font-size:12px;
    line-height:1.5;
}
footer {
    background-color: #4b123b;
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 14px;
    margin-top: auto;

    transition: background-color 0.4s ease;
}

footer:hover {
    background-color: #81245f;
}
    </style>
</head>
<body>
    <header>
      <div class="logo">Creative Space</div>
    <nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Articles</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
    </nav>
</header>
<section class="welcome">
    <h1>Welcome to Our Website</h1>
    <p>Learn, Create and Grow with Us!</p>
    <button>Explore More</button>
</section>
<section class="article">
    <h2>Our Articles</h2>
    <div class="card-container">

        <div class="card">
            <h3>HTML</h3>
            <p>Build the structure of a website</p>
        </div>
        <div class="card">
            <h3>CSS</h3>
            <p>Make your website beautiful</p>
        </div>
        <div class="card">
            <h3>JavaScript</h3>
            <p>Make your website interactive</p>
        </div>
    </div>
</section>
<footer>
    <p> &copy; 2026 Creative Space | Learn Something New </p>
</footer>
</body>
</html>
